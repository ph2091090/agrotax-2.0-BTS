<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AGROTAX</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; place-content:center; justify-items:center; gap:18px; background:#2f8f5b; color:#fff; font-family:Ubuntu,system-ui,sans-serif; }
  .marca { width:86px; height:86px; border-radius:22px; background:#fff; color:#2f8f5b; display:grid; place-items:center; font-weight:700; font-size:1.5rem; box-shadow:0 12px 30px rgba(0,0,0,.18); }
  h1 { margin:0; font-size:1.1rem; letter-spacing:.12em; }
  p { margin:0; font-size:.82rem; opacity:.85; }
  .linha { width:180px; height:3px; border-radius:3px; background:rgba(255,255,255,.28); overflow:hidden; }
  .linha::after { content:''; display:block; width:40%; height:100%; background:#fff; animation:carregar 1.1s ease-in-out infinite; }
  @keyframes carregar { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
</style>
</head>
<body>
  <div class="marca" aria-hidden="true">Agro</div>
  <h1>AGROTAX</h1>
  <div class="linha" aria-hidden="true"></div>
  <p>Calculadora tributária para o agronegócio</p>
</body>
</html>
