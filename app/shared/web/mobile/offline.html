<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGROTAX — sem conexão</title>
<style>
  :root { --verde:#2f8f5b; --fundo:#f6faf7; --texto:#17211b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-content:center; justify-items:center; gap:14px; padding:32px; text-align:center; font-family:Ubuntu,system-ui,sans-serif; background:var(--fundo); color:var(--texto); }
  .marca { width:76px; height:76px; border-radius:20px; display:grid; place-items:center; background:var(--verde); color:#fff; font-weight:700; }
  h1 { font-size:1.25rem; margin:0; }
  p { margin:0; max-width:420px; color:#5d6b63; font-size:.92rem; }
  button { font:inherit; font-weight:600; color:#fff; background:var(--verde); border:0; border-radius:8px; padding:12px 22px; min-height:48px; cursor:pointer; }
</style>
</head>
<body>
  <div class="marca" aria-hidden="true">Agro</div>
  <h1>Sem conexão com o AgroTax</h1>
  <p>As simulações, o guia fiscal e o painel usam o mesmo servidor do site. Verifique sua internet e tente novamente.</p>
  <button type="button" onclick="location.href='/'" id="agrotax-tentar">Tentar novamente</button>
  <script>
    var alvo = new URLSearchParams(location.search).get('url');
    if (alvo && /^https:\/\/[a-z0-9.-]+(\/|$)/i.test(alvo)) {
      document.getElementById('agrotax-tentar').onclick = function () { location.href = alvo; };
    }
  </script>
</body>
</html>
